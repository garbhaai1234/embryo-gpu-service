# Copy to config.ini and set EMBRYO_API_KEY in the deployment environment.
# Model weights are provisioned separately and are not stored in Git.
[models]
maskrcnn_path = maskrcnn_sperm_latest_v2.pth
classifier_path = best_convnextv2_base.pt
gardners_path = best_gardners.pt
device = cuda
batch_size = 32

[detect]
use_slicing = false
slice_rows = 2
slice_cols = 2
slice_overlap_ratio = 0.20
score_thresh = 0.55
mask_thresh = 0.50
nms_iou_thresh = 0.45
min_mask_area = 15
max_mask_area = 100000
tile_batch_size = 4
use_amp = true
yolo_log_enabled = true
yolo_log_path = best.pt
yolo_log_conf = 0.25
yolo_log_iou = 0.45
yolo_log_imgsz = 640
yolo_log_multi_min = 2

[app]
api_key =
port = 5003
